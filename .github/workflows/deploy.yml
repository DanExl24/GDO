name: Deploy to VPS (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            # 1. Directorio del proyecto en el VPS
            TARGET_DIR="/home/${{ secrets.VPS_USERNAME }}/GDO"
            if [ ! -d "$TARGET_DIR" ] && [ -d "/home/${{ secrets.VPS_USERNAME }}/gdo" ]; then
              TARGET_DIR="/home/${{ secrets.VPS_USERNAME }}/gdo"
            fi

            echo "📂 Navegando a: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 2. Actualizar repositorio a la rama main
            echo "🔄 Actualizando código desde Git (main)..."
            git checkout main
            git pull origin main

            # 3. Validar existencia del archivo .env
            if [ ! -f ".env" ]; then
              echo "❌ ERROR: No se encontró el archivo .env en $TARGET_DIR. Abortando despliegue."
              exit 1
            fi

            # 4. Construir y levantar contenedores con Docker Compose
            echo "🏗️ Construyendo y levantando contenedores..."
            docker compose up -d --build --remove-orphans

            # 5. Ejecutar migraciones / inicialización de base de datos
            echo "🗄️ Inicializando / migrando base de datos..."
            docker compose exec -T backend npm run init-db:prod

            # 6. Limpieza de imágenes intermedias huérfanas
            echo "🧹 Limpiando imágenes docker antiguas..."
            docker image prune -f

            echo "🎉 ¡Despliegue completado exitosamente!"
