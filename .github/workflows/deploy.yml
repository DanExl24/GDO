name: Deploy to VPS (CI/CD)

on:
  push:
    branches:
      - docker-gdo # Se activará automáticamente cada vez que hagas push a la rama docker-gdo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            # 1. Paths and Repository Configurations
            TARGET_DIR="/home/${{ secrets.VPS_USER }}/gdo"
            REPO_URL="https://github.com/DanExl24/GDO.git"

            # 2. Preparation Funnel: Ensure files exist on the disk
            if [ ! -d "$TARGET_DIR" ]; then
              echo "First deployment: Creating directory and cloning repository..."
              mkdir -p "$TARGET_DIR"
              git clone -b docker-gdo $REPO_URL "$TARGET_DIR"
              cd "$TARGET_DIR"
              
              if [ -f ".env.example" ]; then
                cp .env.example .env
                echo "Setting up .env based on .env.example."
              else
                touch .env
                echo "An empty .env file has been created."
              fi
              
              echo "⚠️  BLOQUEO DE SEGURIDAD: Se ha detenido el despliegue."
              echo "Please, enter by SSH to your VPS, edit the file '$TARGET_DIR/.env' with your real credentials and run the pipeline again."
              exit 1
            else
              echo "🔄 Continuous deployment: Updating the repository..."
              cd "$TARGET_DIR"
              git pull origin docker-gdo
            fi

            # 3. Security Check: Checking that the .env is not empty before building
            if [ ! -s ".env" ]; then
              echo "❌ ERROR: The production .env file is empty or not configured. Aborting build."
              exit 1
            fi

            # 4. Principal Action: Building and Starting the Infrastructure
            echo "🏗️ Building and starting containers in production..."
            docker compose up -d --build

            # 5. Database Automation: Automatic Migrations
            echo "🗄️ Running database initialization..."
            docker compose exec -T backend npm run init-db

            echo "✅ Deployment completed successfully!"
