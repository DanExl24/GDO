version: '3.8'

services:
  # 1. Base de datos PostgreSQL (Solo acceso interno)
  postgres:
    image: postgres:17-alpine
    container_name: gdo-postgres
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gdo}
    volumes:
      - gdo_db_data:/var/lib/postgresql/data
    networks:
      gdo-network:
        aliases:
          - postgres

  # 2. Servidor Backend Express (Socket.io)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gdo-backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gdo}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
    depends_on:
      - postgres
    networks:
      - gdo-network
      - proxy-network

  # 3. Cliente Frontend (Quasar con Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - API_URL=${VITE_API_URL:-https://api-gdo.adsoproject.dev}
    container_name: gdo-frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    depends_on:
      - backend
    networks:
      - gdo-network
      - proxy-network

networks:
  gdo-network:
    driver: bridge
  proxy-network:
    external: true

volumes:
  gdo_db_data:
